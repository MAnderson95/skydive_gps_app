<title>Flight Trace</title>
<style>
  :root{
    --bg:#0a0f16;
    --surface:#0e1620;
    --surface-2:#16212e;
    --line:#24323f;
    --text:#e7edf3;
    --text-dim:#7e93a8;
    --text-faint:#4d6076;
    --accent:#ff9f1c;
    --accent-dim:#8a5a12;
    --path-ghost:#2f5566;
    --path-live:#4fe0f0;
    --path-glow:#7ff2ff;
    --freefall:#ffcc33;
    --canopy:#eef4f8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0f16; --surface:#0e1620; --surface-2:#16212e; --line:#24323f;
      --text:#e7edf3; --text-dim:#7e93a8; --text-faint:#4d6076;
      --accent:#ff9f1c; --accent-dim:#8a5a12;
      --path-ghost:#2f5566; --path-live:#4fe0f0; --path-glow:#7ff2ff;
      --freefall:#ffcc33; --canopy:#eef4f8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0f16; --surface:#0e1620; --surface-2:#16212e; --line:#24323f;
    --text:#e7edf3; --text-dim:#7e93a8; --text-faint:#4d6076;
    --accent:#ff9f1c; --accent-dim:#8a5a12;
    --path-ghost:#2f5566; --path-live:#4fe0f0; --path-glow:#7ff2ff;
    --freefall:#ffcc33; --canopy:#eef4f8;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  #topbar{
    flex:0 0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--surface), var(--bg));
    flex-wrap:wrap;
  }
  #topbar .title-block{display:flex; flex-direction:column; gap:2px; min-width:0;}
  #topbar h1{
    margin:0; font-size:15px; font-weight:700; letter-spacing:.02em;
    color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #topbar .subtitle{
    font-size:11px; color:var(--text-dim); letter-spacing:.03em;
  }
  #topbar .flight-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px; color:var(--accent);
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  #topbar .flight-time .label{
    color:var(--text-faint); font-family:'Manrope',sans-serif; font-size:10px;
    text-transform:uppercase; letter-spacing:.08em; margin-right:6px;
  }

  #stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    touch-action:none;
  }
  #stage canvas{display:block; width:100%; height:100%; touch-action:none;}

  #hint{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    font-size:11px; color:var(--text-faint); letter-spacing:.03em;
    pointer-events:none; opacity:0; transition:opacity .4s ease;
    background:rgba(10,15,22,.55); padding:4px 10px; border-radius:999px;
    border:1px solid var(--line);
    z-index:5;
  }
  #hint.show{opacity:1;}

  #legend{
    position:absolute; top:10px; right:10px;
    display:flex; flex-direction:column; gap:5px;
    pointer-events:none;
    background:rgba(10,15,22,.55);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 10px;
    z-index:5;
  }
  #legend[hidden]{display:none;}
  #legend .row{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-dim); letter-spacing:.02em;}
  #legend .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}

  #phase-note{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    font-size:10.5px; color:var(--text-faint); letter-spacing:.02em;
    background:rgba(10,15,22,.6); padding:5px 12px; border-radius:999px;
    border:1px solid var(--line);
    max-width:88%; text-align:center;
    pointer-events:none; z-index:5;
  }
  #phase-note[hidden]{display:none;}

  .callout{
    position:absolute;
    transform:translate(-50%,-140%);
    pointer-events:none;
    opacity:0;
    transition:opacity .35s ease;
    z-index:6;
    white-space:nowrap;
  }
  .callout.show{opacity:1;}
  .callout .pin{
    width:6px; height:6px; border-radius:50%;
    margin:0 auto 4px;
    box-shadow:0 0 8px currentColor;
  }
  .callout .card{
    background:rgba(10,15,22,.78);
    border:1px solid var(--line);
    border-radius:7px;
    padding:4px 9px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.02em;
    text-align:center;
  }
  .callout .card .evt{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    display:block;
    margin-bottom:1px;
  }
  .callout.exit .card .evt{color:var(--freefall);}
  .callout.exit .pin{background:var(--freefall); color:var(--freefall);}
  .callout.deploy .card .evt{color:var(--canopy);}
  .callout.deploy .pin{background:var(--canopy); color:var(--canopy);}

  #panel{
    flex:0 0 auto;
    padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:linear-gradient(180deg, var(--bg), var(--surface));
    border-top:1px solid var(--line);
  }

  #scrub-row{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  #playbtn{
    flex:0 0 auto;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
  }
  #playbtn:active{background:var(--line);}
  #playbtn svg{width:14px; height:14px;}

  #scrubber{
    flex:1 1 auto;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    border-radius:2px;
    background:var(--line);
    outline:none;
    cursor:pointer;
  }
  #scrubber::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px; border-radius:50%;
    background:var(--accent);
    border:2px solid var(--bg);
    box-shadow:0 0 0 1px var(--accent-dim);
    cursor:pointer;
  }
  #scrubber::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg);
    cursor:pointer;
  }

  #playback-time{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--text-dim);
    font-variant-numeric:tabular-nums;
    min-width:74px; text-align:right;
  }

  #speed-wrap{
    position:relative;
    flex:0 0 auto;
  }
  #speedbtn{
    flex:0 0 auto;
    width:28px; height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #speedbtn svg{width:14px; height:14px;}
  #speedbtn:active{background:var(--line);}
  #speed-menu{
    position:absolute;
    bottom:calc(100% + 6px);
    right:0;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:4px;
    min-width:130px;
    background:rgba(10,15,22,.94);
    border:1px solid var(--line);
    border-radius:8px;
    z-index:10;
  }
  #speed-menu[hidden]{display:none;}
  #speed-menu .speed-menu-title{
    padding:6px 10px 5px;
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:.04em;
    text-transform:uppercase;
    border-bottom:1px solid var(--line);
    margin-bottom:2px;
  }
  #speed-menu button{
    text-align:left;
    padding:7px 10px;
    border-radius:6px;
    border:none;
    background:none;
    color:var(--text);
    font-family:'Manrope',sans-serif;
    font-size:12px;
    cursor:pointer;
  }
  #speed-menu button:active{background:var(--line);}
  #speed-menu button.active{
    background:var(--surface-2);
    color:var(--accent);
    font-weight:700;
  }

  #stats{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:0;
  }
  .stat{
    padding:6px 10px;
    border-left:1px solid var(--line);
    display:flex; flex-direction:column; gap:2px;
    min-width:0;
  }
  .stat:first-child{border-left:none; padding-left:2px;}
  .stat .stat-label{
    font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-faint); font-weight:700;
  }
  .stat .stat-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px; font-weight:500;
    color:var(--text);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stat .stat-value .unit{
    font-size:10px; color:var(--text-dim); margin-left:2px;
  }
  .stat.accent .stat-value{color:var(--accent);}

  @media (max-width:420px){
    #stats{grid-template-columns:repeat(2, 1fr); row-gap:8px;}
    .stat:nth-child(2n+1){border-left:none; padding-left:2px;}
  }
</style>

<div id="topbar">
  <div class="title-block">
    <h1>Sept 18 Test Drive</h1>
    <div class="subtitle">GPS + barometer test log</div>
  </div>
  <div class="flight-time"><span class="label">Elapsed</span><span id="elapsed-readout">00:00</span> <span style="color:var(--text-faint)">/ </span></div>
</div>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="hint">drag to orbit · scroll to zoom</div>
  <div id="legend" hidden>
    <div class="row"><span class="dot" style="background:var(--freefall)"></span>Freefall / wingsuit</div>
    <div class="row"><span class="dot" style="background:var(--canopy)"></span>Canopy</div>
  </div>
  <div id="phase-note" hidden></div>
  <div id="callout-exit" class="callout exit"><div class="pin"></div><div class="card"><span class="evt">Exit</span><span class="alt"></span></div></div>
  <div id="callout-deploy" class="callout deploy"><div class="pin"></div><div class="card"><span class="evt">Deployment</span><span class="alt"></span></div></div>
</div>

<div id="panel">
  <div id="scrub-row">
    <button id="playbtn" aria-label="Play"></button>
    <input id="scrubber" type="range" min="0" max="1000" value="0" step="1" aria-label="Playback position">
    <div id="playback-time">0:00</div>
    <div id="speed-wrap">
      <button id="speedbtn" aria-haspopup="true" aria-expanded="false" aria-label="Playback speed"></button>
      <div id="speed-menu" hidden role="menu"></div>
    </div>
  </div>
  <div id="stats">
    <div class="stat">
      <div class="stat-label">Altitude</div>
      <div class="stat-value"><span id="stat-alt">0</span><span class="unit">ft</span></div>
    </div>
    <div class="stat accent">
      <div class="stat-label">Vert Speed</div>
      <div class="stat-value"><span id="stat-vspeed">0</span><span class="unit">fpm</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Gnd Speed</div>
      <div class="stat-value"><span id="stat-hspeed">0</span><span class="unit">mph</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Glide</div>
      <div class="stat-value" id="stat-glide">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Distance</div>
      <div class="stat-value"><span id="stat-dist">0</span><span class="unit">mi</span></div>
    </div>
  </div>
</div>

<script>
function runViewer(FLIGHT_DATA, FLIGHT_META, mapImageDataUri, mapMeta){
  'use strict';

  // populate the title block from FLIGHT_META when provided, so each
  // flight shows its own name instead of the bundled demo's static markup
  if (FLIGHT_META && FLIGHT_META.title) {
    document.querySelector('#topbar h1').textContent = FLIGHT_META.title;
  }
  if (FLIGHT_META && FLIGHT_META.subtitle) {
    document.querySelector('#topbar .subtitle').textContent = FLIGHT_META.subtitle;
  }

  const M_TO_FT = 3.28084;
  const M_TO_MI = 0.000621371;
  const MPS_TO_MPH = 2.23694;
  const MPS_TO_FPM = 196.850;

  // ---------- phase detection config (best-guess starting values —  ----------
  // ---------- tune against real flight data + VOG cross-check later) ----------
  const PHASE_CONFIG = {
    freefallVSpeedMps: -8,     // sustained vertical speed more negative than this => freefall/wingsuit
    canopyVSpeedMaxMps: -1,    // least-negative bound still counted as canopy sink rate
    minSustainSeconds: 2.0,    // a candidate phase must hold this long before we trust it
    smoothHalfWindowSeconds: 1.0, // half-width of the time window used to smooth vertical speed
    transitionBlendSeconds: 4.0,  // how long the deployment color blend (yellow->white) spans
  };

  const COLOR_FREEFALL = new THREE.Color(0xffcc33);
  const COLOR_CANOPY = new THREE.Color(0xeef4f8);
  const COLOR_DEFAULT = new THREE.Color(0x4fe0f0); // fallback when no exit is detected (e.g. non-flight test data)

  // ---------- base per-point series (full recording) ----------
  const allPts = FLIGHT_DATA.map(p => ({x:p[0], y:p[1], z:p[2], t:p[3], hSpeed:p[4], acc:p[5]}));
  const allN = allPts.length;

  // vertical speed, smoothed over a time-based window (robust to variable sample rate)
  function smoothedVSpeedAt(i, pts){
    const ti = pts[i].t;
    let a=i, b=i;
    while(a>0 && ti - pts[a-1].t < PHASE_CONFIG.smoothHalfWindowSeconds) a--;
    while(b<pts.length-1 && pts[b+1].t - ti < PHASE_CONFIG.smoothHalfWindowSeconds) b++;
    const dt = pts[b].t - pts[a].t;
    return dt > 0.15 ? (pts[b].y - pts[a].y) / dt : 0;
  }

  // ---------- classify phases on the full recording ----------
  function classifyPhases(pts){
    const n = pts.length;
    const vSmooth = new Array(n);
    for(let i=0;i<n;i++) vSmooth[i] = smoothedVSpeedAt(i, pts);

    let confirmed = 'PLANE';
    let haveSeenFreefall = false;
    let candidate = null, candidateStartT = 0, candidateStartIdx = 0;

    let exitOnsetIdx = -1, exitConfirmedIdx = -1;
    let deployOnsetIdx = -1, deployConfirmedIdx = -1;

    for(let i=0;i<n;i++){
      const v = vSmooth[i];
      let rawBand;
      if(v < PHASE_CONFIG.freefallVSpeedMps) rawBand = 'FREEFALL';
      else if(v <= PHASE_CONFIG.canopyVSpeedMaxMps) rawBand = 'MID';
      else rawBand = 'PLANE';

      let desired;
      if(rawBand === 'FREEFALL') desired = 'FREEFALL';
      else if(rawBand === 'MID') desired = haveSeenFreefall ? 'CANOPY' : 'PLANE';
      else desired = 'PLANE';

      if(desired === confirmed){
        candidate = null;
      } else {
        if(candidate !== desired){
          candidate = desired;
          candidateStartT = pts[i].t;
          candidateStartIdx = i;
        } else if(pts[i].t - candidateStartT >= PHASE_CONFIG.minSustainSeconds){
          confirmed = desired;
          if(desired === 'FREEFALL' && exitOnsetIdx === -1){
            haveSeenFreefall = true;
            exitOnsetIdx = candidateStartIdx;
            exitConfirmedIdx = i;
          }
          if(desired === 'CANOPY' && deployOnsetIdx === -1){
            deployOnsetIdx = candidateStartIdx;
            deployConfirmedIdx = i;
          }
          candidate = null;
        }
      }
    }

    return {
      hasExit: exitOnsetIdx !== -1,
      exitOnsetIdx, exitConfirmedIdx,
      hasDeployment: deployOnsetIdx !== -1,
      deployOnsetIdx, deployConfirmedIdx,
    };
  }

  const phases = classifyPhases(allPts);

  // ---------- build the point set actually rendered/played ----------
  // trims the plane ride out entirely once an exit is detected; falls back to
  // showing the whole recording (single default color) when it isn't (e.g. a
  // driving test with no real skydive phases in it).
  const trimStart = phases.hasExit ? phases.exitOnsetIdx : 0;
  const pts = allPts.slice(trimStart);
  const N = pts.length;
  const deployOnsetRel = phases.hasDeployment ? phases.deployOnsetIdx - trimStart : -1;
  const deployConfirmedRel = phases.hasDeployment ? phases.deployConfirmedIdx - trimStart : -1;

  let cumHorizDist = new Array(N).fill(0);
  for(let i=1;i<N;i++){
    const dx = pts[i].x - pts[i-1].x, dz = pts[i].z - pts[i-1].z;
    cumHorizDist[i] = cumHorizDist[i-1] + Math.hypot(dx,dz);
  }

  const totalDuration = pts[N-1].t - pts[0].t;

  // bounding box (of the rendered/trimmed segment only, so framing isn't skewed by the plane ride)
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity;
  pts.forEach(p=>{
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
    minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z);
  });
  const center = new THREE.Vector3((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2);
  const span = Math.max(maxX-minX, maxZ-minZ, 20);
  const diag = Math.hypot(maxX-minX, maxY-minY, maxZ-minZ) || 100;

  // ---------- per-point color (phase + smooth blend through the deployment window) ----------
  function colorForIndex(i){
    if(!phases.hasExit) return COLOR_DEFAULT;
    if(!phases.hasDeployment || i < deployOnsetRel) return COLOR_FREEFALL;
    if(i >= deployConfirmedRel) return COLOR_CANOPY;
    const span = Math.max(pts[deployConfirmedRel].t - pts[deployOnsetRel].t, 0.5);
    const frac = (pts[i].t - pts[deployOnsetRel].t) / span;
    return COLOR_FREEFALL.clone().lerp(COLOR_CANOPY, Math.min(1, Math.max(0, frac)));
  }

  // ---------- three.js scene ----------
  const canvas = document.getElementById('gl');
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0f16);
  scene.fog = new THREE.Fog(0x0a0f16, diag*1.2, diag*4.5);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, Math.max(20000, diag*8));

  // ground grid + dark fill plane — only when there's no real map image to
  // show instead. These used to always render underneath the map image too,
  // separated from it and from each other by tiny fixed offsets (fine at the
  // small scale of early test data, but at real-world flight/drive scale
  // those offsets are far smaller than depth-buffer precision at typical
  // camera distance, causing visible z-fighting/shimmer between the grid,
  // the fill, and the map — confirmed on real data 2026-09-21). Simplest
  // correct fix: when a map image is present, it's the ground — don't also
  // draw a competing grid and fill plane underneath it.
  const haveMapImage = !!(mapImageDataUri && mapMeta && mapMeta.widthMeters > 0);
  const gridSize = Math.max(span*1.6, 40);
  if (!haveMapImage) {
    const gridDivisions = 24;
    const grid = new THREE.GridHelper(gridSize, gridDivisions, 0x2a3b4a, 0x1a2732);
    grid.position.set(center.x, minY, center.z);
    scene.add(grid);

    // subtle ground fill plane (very dark, just under grid to stop see-through fog banding)
    const groundGeo = new THREE.PlaneGeometry(gridSize*1.2, gridSize*1.2);
    const groundMat = new THREE.MeshBasicMaterial({color:0x0c131b, transparent:true, opacity:0.6});
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI/2;
    groundMesh.position.set(center.x, minY - 0.05, center.z);
    scene.add(groundMesh);
  }

  // real satellite imagery, textured under the flight path (optional — only
  // present when the Android app supplied a fetched image + its real-world
  // size). When present, it's the sole ground layer (see note above).
  if (haveMapImage) {
    const mapTex = new THREE.TextureLoader().load(mapImageDataUri);
    // Mipmaps on + a mip-aware minFilter (LinearFilter alone ignores mips
    // even if generated) — fixes shimmer/aliasing on the ground plane when
    // viewed at an angle from the orbit camera. One-time GPU cost at texture
    // upload, not a per-frame cost, unlike antialiasing/pixelRatio.
    mapTex.minFilter = THREE.LinearMipmapLinearFilter;
    mapTex.generateMipmaps = true;
    const mapGeo = new THREE.PlaneGeometry(mapMeta.widthMeters, mapMeta.heightMeters);
    mapTex.wrapT = THREE.RepeatWrapping;
    mapTex.wrapS = THREE.RepeatWrapping;
    mapTex.repeat.y = -1; // the ground plane's rotation otherwise mirrors the image north-south
    mapTex.repeat.x = -1; // ...and east-west too
    const mapMat = new THREE.MeshBasicMaterial({map: mapTex});
    const mapMesh = new THREE.Mesh(mapGeo, mapMat);
    mapMesh.rotation.x = -Math.PI/2;
    // mapMeta.centerX/centerZ are the map image's local-frame center — by
    // convention this is the same origin used for the lat/lon -> local x/z
    // conversion, so it is usually (0,0), but read from mapMeta rather than
    // assumed so the two stay coupled if that convention ever changes.
    mapMesh.position.set(mapMeta.centerX || 0, minY - 0.045, mapMeta.centerZ || 0);
    scene.add(mapMesh);
  }

  const positions = new Float32Array(N*3);
  const vertexColors = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    positions[i*3]=pts[i].x; positions[i*3+1]=pts[i].y; positions[i*3+2]=pts[i].z;
    const c = colorForIndex(i);
    vertexColors[i*3]=c.r; vertexColors[i*3+1]=c.g; vertexColors[i*3+2]=c.b;
  }

  // live traced path (grows as playback advances — nothing is drawn ahead of
  // the marker; the path only reveals itself as it's flown, not before).
  // Uses the three.js "fat line" technique (Line2/LineMaterial/LineGeometry,
  // bundled in above as a plain script since THREE.Line's basic material
  // ignores linewidth on most GPUs/browsers — a known platform limitation).
  // Width is fixed in screen pixels via the resolution uniform (kept in
  // sync in resize()), so the path reads the same thickness at any zoom.
  const liveGeo = new THREE.LineGeometry();
  liveGeo.setPositions(positions);
  liveGeo.setColors(vertexColors);
  const liveMat = new THREE.LineMaterial({
    vertexColors: true,
    linewidth: 3.5,
    alphaToCoverage: true,
  });
  liveMat.resolution.set(stage.clientWidth, stage.clientHeight);
  const liveLine = new THREE.Line2(liveGeo, liveMat);
  liveLine.computeLineDistances();
  liveLine.geometry.instanceCount = 0; // nothing revealed until playback starts
  scene.add(liveLine);

  // current position marker: bright core + soft glow sprite (tinted to current phase color)
  const markerGeo = new THREE.SphereGeometry(Math.max(diag*0.006, 0.6), 16, 16);
  const markerMat = new THREE.MeshBasicMaterial({color:0xffffff});
  const marker = new THREE.Mesh(markerGeo, markerMat);
  scene.add(marker);

  function makeGlowTexture(){
    const size = 128;
    const c = document.createElement('canvas'); c.width=c.height=size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    g.addColorStop(0,'rgba(255,255,255,0.9)');
    g.addColorStop(0.4,'rgba(255,255,255,0.35)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,size,size);
    return new THREE.CanvasTexture(c);
  }
  const glowMat = new THREE.SpriteMaterial({map:makeGlowTexture(), color:0x4fe0f0, transparent:true, depthWrite:false});
  const glow = new THREE.Sprite(glowMat);
  const glowScale = Math.max(diag*0.05, 4);
  glow.scale.set(glowScale, glowScale, 1);
  scene.add(glow);

  // start marker (exit point if detected, otherwise recording start)
  function makeEndpoint(pos, color){
    const g = new THREE.SphereGeometry(Math.max(diag*0.004,0.4), 12, 12);
    const m = new THREE.MeshBasicMaterial({color});
    const mesh = new THREE.Mesh(g,m);
    mesh.position.copy(pos);
    scene.add(mesh);
    return mesh;
  }
  makeEndpoint(new THREE.Vector3(pts[0].x,pts[0].y,pts[0].z), 0xff9f1c);

  // ---------- custom orbit camera (no addon dependency) ----------
  let theta = Math.PI*0.25, phi = Math.PI*0.32;
  let radius = Math.max(diag*1.15, 30);
  const minRadius = Math.max(diag*0.08, 3), maxRadius = diag*6;

  function updateCamera(){
    const cx = center.x + radius*Math.sin(phi)*Math.sin(theta);
    const cy = center.y + radius*Math.cos(phi);
    const cz = center.z + radius*Math.sin(phi)*Math.cos(theta);
    camera.position.set(cx,cy,cz);
    camera.lookAt(center);
  }
  updateCamera();

  let dragging=false, lastX=0, lastY=0;
  const pointers = new Map();
  let pinchStartDist=0, pinchStartRadius=0;
  const hintEl = document.getElementById('hint');
  let hintTimer=null;
  function showHint(){
    hintEl.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(()=>hintEl.classList.remove('show'), 1800);
  }

  stage.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if(pointers.size===1){ dragging=true; lastX=e.clientX; lastY=e.clientY; }
    if(pointers.size===2){
      const [a,b] = [...pointers.values()];
      pinchStartDist = Math.hypot(a.x-b.x, a.y-b.y);
      pinchStartRadius = radius;
    }
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if(pointers.size===2){
      const [a,b] = [...pointers.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      radius = Math.min(maxRadius, Math.max(minRadius, pinchStartRadius * (pinchStartDist/Math.max(d,1))));
      updateCamera();
      return;
    }
    if(dragging && pointers.size===1){
      const dx = e.clientX-lastX, dy = e.clientY-lastY;
      lastX=e.clientX; lastY=e.clientY;
      theta -= dx*0.006;
      phi = Math.min(Math.PI*0.49, Math.max(Math.PI*0.06, phi - dy*0.006));
      updateCamera();
      showHint();
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size<2) pinchStartDist=0;
    if(pointers.size===0) dragging=false;
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    radius = Math.min(maxRadius, Math.max(minRadius, radius * (1 + e.deltaY*0.001)));
    updateCamera();
  }, {passive:false});
  setTimeout(showHint, 600);

  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w,h,false);
    camera.aspect = w/Math.max(h,1);
    camera.updateProjectionMatrix();
    liveMat.resolution.set(w,h); // fat-line width is resolution-dependent — keep in sync
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- legend / phase-note ----------
  const legendEl = document.getElementById('legend');
  const phaseNoteEl = document.getElementById('phase-note');
  if(phases.hasExit){
    legendEl.hidden = false;
  } else {
    phaseNoteEl.hidden = false;
    phaseNoteEl.textContent = 'No exit detected in this log — showing the full recording (phase coloring needs a real skydive to trigger).';
  }

  // ---------- callouts (projected from 3D onto the 2D overlay) ----------
  const calloutExitEl = document.getElementById('callout-exit');
  const calloutDeployEl = document.getElementById('callout-deploy');
  const exitAnchor = new THREE.Vector3(pts[0].x, pts[0].y, pts[0].z);
  const deployAnchor = phases.hasDeployment
    ? new THREE.Vector3(pts[deployOnsetRel].x, pts[deployOnsetRel].y, pts[deployOnsetRel].z)
    : null;
  if(phases.hasExit){
    calloutExitEl.querySelector('.alt').textContent = Math.round(pts[0].y*M_TO_FT).toLocaleString()+' ft';
  }
  if(deployAnchor){
    calloutDeployEl.querySelector('.alt').textContent = Math.round(pts[deployOnsetRel].y*M_TO_FT).toLocaleString()+' ft';
  }

  function positionCallout(el, anchor){
    const p = anchor.clone().project(camera);
    if(p.z > 1){ el.classList.remove('show'); return; }
    const w = stage.clientWidth, h = stage.clientHeight;
    const x = (p.x*0.5+0.5)*w, y = (1-(p.y*0.5+0.5))*h;
    if(x<-40||x>w+40||y<-40||y>h+40){ el.classList.remove('show'); return; }
    el.style.left = x+'px';
    el.style.top = y+'px';
  }

  // ---------- playback ----------
  // Three speed presets, selectable from a small menu next to the scrubber.
  // "Compressed" is today's original (and still default) behavior, unchanged
  // — an adaptive clip length, not a literal fixed number, so its label
  // describes what it does rather than promising an exact duration. "Real
  // time" plays back the already-trimmed exit-to-landing segment (the same
  // totalDuration the compressed default is based on) at its actual pace —
  // the plane's climb to altitude was already excluded upstream by
  // classifyPhases()'s trim, nothing extra needed here for that.
  const SPEED_PRESETS = [
    { label:'Compressed', shortLabel:'Comp', seconds: Math.min(30, Math.max(15, totalDuration/20)) },
    { label:'90 seconds',  shortLabel:'90s',  seconds: 90 },
    { label:'Real time',   shortLabel:'Real', seconds: totalDuration },
  ];
  let speedIndex = 0;
  let PLAYBACK_SECONDS = SPEED_PRESETS[speedIndex].seconds;
  let playing = true;
  let playbackT = 0; // 0..PLAYBACK_SECONDS
  let lastFrame = performance.now();

  const scrubber = document.getElementById('scrubber');
  const playbtn = document.getElementById('playbtn');
  const playbackTimeEl = document.getElementById('playback-time');
  const elapsedReadout = document.getElementById('elapsed-readout');
  const statAlt = document.getElementById('stat-alt');
  const statV = document.getElementById('stat-vspeed');
  const statH = document.getElementById('stat-hspeed');
  const statGlide = document.getElementById('stat-glide');
  const statDist = document.getElementById('stat-dist');

  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const ICON_STOPWATCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="2" x2="15" y2="2"/><line x1="12" y1="2" x2="12" y2="5"/><circle cx="12" cy="14" r="8"/><line x1="12" y1="14" x2="12" y2="10"/><line x1="12" y1="14" x2="15" y2="16"/></svg>';
  playbtn.innerHTML = ICON_PAUSE;

  function fmtClock(sec){
    sec = Math.max(0,sec);
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return m+':'+String(s).padStart(2,'0');
  }
  function fmtClockLong(sec){
    sec = Math.max(0,sec);
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
    if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    return m+':'+String(s).padStart(2,'0');
  }

  document.querySelector('#topbar .flight-time').lastChild.textContent = ' / ' + fmtClockLong(totalDuration);
  document.querySelector('#topbar .flight-time .label').textContent = phases.hasExit ? 'Since exit' : 'Elapsed';

  const STATS_WINDOW_SECONDS = 5.0;
  function windowStartIndex(i, seconds){
    // trailing-only window (looks backward from i, never ahead) so the stat
    // reflects "recent history up to now", matching how a live instrument would read
    let a = i;
    while(a>0 && pts[i].t - pts[a-1].t < seconds) a--;
    return a;
  }

  function findIndexForTime(tSec){
    // binary search pts[].t (relative to pts[0]) for tSec
    let lo=0, hi=N-1;
    const target = pts[0].t + tSec;
    if(target<=pts[0].t) return 0;
    if(target>=pts[N-1].t) return N-1;
    while(lo<hi){
      const mid=(lo+hi)>>1;
      if(pts[mid].t<target) lo=mid+1; else hi=mid;
    }
    return Math.max(0,lo-1);
  }

  function setByFraction(frac){
    frac = Math.min(1, Math.max(0, frac));
    playbackT = frac * PLAYBACK_SECONDS;
    render(frac);
    scrubber.value = Math.round(frac*1000);
    playbackTimeEl.textContent = fmtClock(playbackT)+' / '+fmtClock(PLAYBACK_SECONDS);
  }

  function render(frac){
    const flightT = frac * totalDuration;
    const i = findIndexForTime(flightT);
    const count = Math.max(2, i+1);
    liveLine.geometry.instanceCount = Math.max(1, count-1); // fat-line equivalent of setDrawRange

    const p = pts[i];
    marker.position.set(p.x,p.y,p.z);
    glow.position.set(p.x,p.y,p.z);
    const c = colorForIndex(i);
    glowMat.color.copy(c);

    elapsedReadout.textContent = fmtClockLong(flightT);

    const altFt = (p.y) * M_TO_FT;
    statAlt.textContent = Math.round(altFt).toLocaleString();

    // unified trailing rolling-window average (vertical + horizontal use the
    // same window so they behave consistently) — smooths out GPS/baro jitter
    // while still tracking real changes like the ramp-up to terminal velocity,
    // rather than a full-flight cumulative average that a driving test showed
    // gets dragged down by any stopped/slow stretches.
    const winA = windowStartIndex(i, STATS_WINDOW_SECONDS);
    const dtWin = p.t - pts[winA].t;
    const elapsedT = p.t - pts[0].t;

    const vAvgWindow = dtWin>0.3 ? (p.y - pts[winA].y)/dtWin
      : (elapsedT>0.001 ? (p.y - pts[0].y)/elapsedT : 0);
    statV.textContent = Math.round(vAvgWindow*MPS_TO_FPM).toLocaleString();

    const hAvgWindow = dtWin>0.3 ? (cumHorizDist[i]-cumHorizDist[winA])/dtWin
      : p.hSpeed;
    statH.textContent = (hAvgWindow*MPS_TO_MPH).toFixed(1);

    const vertDrop = pts[0].y - p.y;
    if(Math.abs(vertDrop) < 1 || cumHorizDist[i] < 1){
      statGlide.textContent = '—';
    } else {
      const ratio = cumHorizDist[i] / Math.abs(vertDrop);
      statGlide.textContent = ratio > 200 ? '—' : ratio.toFixed(1)+' : 1';
    }

    // cumulative ground track distance flown so far (horizontal only, not
    // path-through-the-air distance) — reuses cumHorizDist, already computed
    // once from the same x/z series the glide-ratio stat above reads from
    statDist.textContent = (cumHorizDist[i] * M_TO_MI).toFixed(2);

    if(phases.hasExit){
      calloutExitEl.classList.add('show');
      positionCallout(calloutExitEl, exitAnchor);
    }
    if(deployAnchor){
      if(i >= deployOnsetRel){
        calloutDeployEl.classList.add('show');
        positionCallout(calloutDeployEl, deployAnchor);
      } else {
        calloutDeployEl.classList.remove('show');
      }
    }
  }

  scrubber.addEventListener('input', ()=>{
    playing = false;
    playbtn.innerHTML = ICON_PLAY;
    setByFraction(scrubber.value/1000);
  });

  playbtn.addEventListener('click', ()=>{
    playing = !playing;
    playbtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    if(playing && playbackT >= PLAYBACK_SECONDS-0.05){
      playbackT = 0;
    }
    lastFrame = performance.now();
  });

  // ---------- playback speed menu ----------
  const speedbtn = document.getElementById('speedbtn');
  const speedMenu = document.getElementById('speed-menu');
  speedbtn.innerHTML = ICON_STOPWATCH; // static icon; the button no longer echoes the selected preset as text
  speedMenu.innerHTML = '<div class="speed-menu-title" aria-hidden="true">Playback speed</div>' +
    SPEED_PRESETS.map((p,i)=>
      '<button type="button" role="menuitemradio" data-speed-idx="'+i+'">'+p.label+'</button>'
    ).join('');
  const speedMenuButtons = [...speedMenu.querySelectorAll('button')];

  function updateSpeedUi(){
    speedMenuButtons.forEach((btn,i)=>{
      btn.classList.toggle('active', i===speedIndex);
      btn.setAttribute('aria-checked', i===speedIndex ? 'true' : 'false');
    });
  }
  updateSpeedUi();

  function openSpeedMenu(){ speedMenu.hidden = false; speedbtn.setAttribute('aria-expanded','true'); }
  function closeSpeedMenu(){ speedMenu.hidden = true; speedbtn.setAttribute('aria-expanded','false'); }

  speedbtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(speedMenu.hidden) openSpeedMenu(); else closeSpeedMenu();
  });
  document.addEventListener('click', ()=>{ closeSpeedMenu(); });
  speedMenu.addEventListener('click', (e)=>{ e.stopPropagation(); });

  speedMenuButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.speedIdx, 10);
      closeSpeedMenu();
      if(idx === speedIndex) return;
      // preserve the current position in the flight across the speed change
      // (convert to a fraction of the old duration, reapply to the new one)
      // rather than resetting playback to the start.
      const frac = PLAYBACK_SECONDS > 0 ? playbackT/PLAYBACK_SECONDS : 0;
      speedIndex = idx;
      PLAYBACK_SECONDS = SPEED_PRESETS[speedIndex].seconds;
      updateSpeedUi();
      setByFraction(frac);
    });
  });

  setByFraction(0);

  function loop(now){
    const dt = Math.min(0.05, (now-lastFrame)/1000);
    lastFrame = now;
    if(playing){
      playbackT += dt;
      if(playbackT >= PLAYBACK_SECONDS){
        playbackT = PLAYBACK_SECONDS;
        playing = false;
        playbtn.innerHTML = ICON_PLAY;
      }
      setByFraction(playbackT/PLAYBACK_SECONDS);
    }
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

}
window.runViewer = runViewer;
</script>

</body></html>
